<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order — LISENZO TOP UP</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .order-box {
      max-width: 600px;
      margin: 40px auto;
      background: #fff;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    .selected-product {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
    }

    .selected-product h2 {
      margin-top: 0;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .form-group input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 16px;
    }

    .submit-btn {
      width: 100%;
      border: none;
      background: #f59e0b;
      color: white;
      padding: 14px;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .submit-btn:hover {
      background: #d97706;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #555;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header class="header">
  <div class="brand">
    LISENZO <span>TOP UP</span>
  </div>

  <a class="admin-link" href="admin.html">
    Admin
  </a>
</header>

<main>

  <div class="order-box">

    <h1>🛒 Order Now</h1>

    <div class="selected-product">

      <h2 id="coinText">eFootball Coins</h2>

      <p>
        মূল্য:
        <strong id="priceText">৳0</strong>
      </p>

    </div>

    <form id="orderForm">

      <div class="form-group">
        <label for="playerId">
          eFootball Player ID
        </label>

        <input
          type="text"
          id="playerId"
          required
          placeholder="আপনার Player ID লিখুন"
        >
      </div>

      <div class="form-group">
        <label for="phone">
          মোবাইল নম্বর
        </label>

        <input
          type="tel"
          id="phone"
          required
          placeholder="01XXXXXXXXX"
        >
      </div>

      <button
        type="submit"
        class="submit-btn"
      >
        Confirm Order
      </button>

    </form>

    <a href="index.html" class="back-link">
      ← প্যাকেজে ফিরে যান
    </a>

  </div>

</main>

<footer class="footer">

  <strong>LISENZO TOP UP</strong>

  <div>
    eFootball Coin Top-Up Service
  </div>

  <div>
    © 2026 LISENZO TOP UP
  </div>

</footer>


<script>

  const params = new URLSearchParams(
    window.location.search
  );

  const coins = params.get("coins");
  const price = params.get("price");

  if (coins && price) {

    document.getElementById("coinText").textContent =
      coins + " eFootball Coins";

    document.getElementById("priceText").textContent =
      "৳" + price;

  }


  document.getElementById("orderForm").addEventListener(
    "submit",
    function(event) {

      event.preventDefault();

      const playerId =
        document.getElementById("playerId").value.trim();

      const phone =
        document.getElementById("phone").value.trim();

      if (!playerId || !phone) {
        alert("সব তথ্য পূরণ করুন।");
        return;
      }

      alert(
        "Order received!\n\n" +
        coins + " Coins\n" +
        "Price: ৳" + price + "\n" +
        "Player ID: " + playerId + "\n" +
        "Phone: " + phone
      );

    }
  );

</script>

</body>
</html>
