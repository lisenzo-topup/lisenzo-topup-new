<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order - LISENZO TOP UP</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5fa;
      color: #111827;
    }

    header {
      background: #ffffff;
      padding: 22px 6%;
      font-size: 24px;
      font-weight: bold;
      color: #f59e0b;
      border-bottom: 1px solid #ddd;
    }

    .container {
      max-width: 700px;
      margin: 50px auto;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    .product {
      background: #111827;
      color: white;
      padding: 22px;
      border-radius: 14px;
      margin-bottom: 25px;
    }

    .product-name {
      font-size: 23px;
      font-weight: bold;
    }

    .price {
      color: #f59e0b;
      font-size: 27px;
      font-weight: bold;
      margin-top: 8px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #f59e0b;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 9px;
      background: #f59e0b;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #d97706;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #374151;
      text-decoration: none;
    }

    footer {
      margin-top: 60px;
      padding: 30px;
      text-align: center;
      background: #111827;
      color: white;
    }
  </style>
</head>

<body>

<header>
  LISENZO TOP UP
</header>

<div class="container">

  <div class="card">

    <h1>⚽ Order Now</h1>

    <div class="product">
      <div class="product-name" id="productName">
        eFootball Coins
      </div>

      <div class="price" id="productPrice">
        ৳0
      </div>
    </div>

    <form id="orderForm">

      <label for="name">আপনার নাম</label>
      <input
        type="text"
        id="name"
        placeholder="আপনার নাম লিখুন"
        required
      >

      <label for="phone">মোবাইল নম্বর</label>
      <input
        type="tel"
        id="phone"
        placeholder="01XXXXXXXXX"
        required
      >

      <label for="gameId">eFootball User ID</label>
      <input
        type="text"
        id="gameId"
        placeholder="আপনার eFootball ID লিখুন"
        required
      >

      <label for="payment">Payment Method</label>
      <select id="payment" required>
        <option value="">Payment Method নির্বাচন করুন</option>
        <option value="bKash">bKash</option>
        <option value="Nagad">Nagad</option>
        <option value="Rocket">Rocket</option>
      </select>

      <label for="transaction">Transaction ID</label>
      <input
        type="text"
        id="transaction"
        placeholder="Payment করার পর Transaction ID দিন"
        required
      >

      <button type="submit">
        Confirm Order
      </button>

    </form>

    <a class="back" href="index.html">
      ← ফিরে যান
    </a>

  </div>

</div>

<footer>
  <strong>LISENZO TOP UP</strong><br>
  eFootball Coin Top-Up Service<br><br>
  © 2026 LISENZO TOP UP
</footer>


<script>

  // URL থেকে product information নেওয়া
  const params = new URLSearchParams(window.location.search);

  const product = params.get("product") || "eFootball Coins";
  const price = params.get("price") || "0";

  document.getElementById("productName").textContent = product;
  document.getElementById("productPrice").textContent = "৳" + price;


  // Order submit
  document.getElementById("orderForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const gameId = document.getElementById("gameId").value.trim();
    const payment = document.getElementById("payment").value;
    const transaction = document.getElementById("transaction").value.trim();

    if (!name || !phone || !gameId || !payment || !transaction) {
      alert("সব তথ্য পূরণ করুন।");
      return;
    }

    const order = {
      product: product,
      price: price,
      name: name,
      phone: phone,
      gameId: gameId,
      payment: payment,
      transaction: transaction,
      time: new Date().toLocaleString()
    };

    console.log("ORDER:", order);

    alert(
      "অর্ডার তথ্য গ্রহণ করা হয়েছে।\n\n" +
      "Product: " + product + "\n" +
      "Price: ৳" + price + "\n\n" +
      "পরবর্তী ধাপে আমরা এটিকে Admin Panel-এর সাথে সংযুক্ত করব।"
    );

  });

</script>

</body>
</html>
